name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build IPA
        run: |
          flet build ipa --verbose

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: heaps-ide-ipa
          path: build/ipa/*.ipa
          if-no-files-found: warn