name: Build iOS Archive

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build IPA (allow failure)
        continue-on-error: true
        run: |
          flet build ipa --verbose

      - name: Snapshot build dir before cleanup
        if: always()
        run: |
          echo "===== 当前 build 目录 ====="
          ls -la build/ || echo "build 不存在"
          echo "===== 搜索 xcarchive ====="
          find . -name "*.xcarchive" -type d || true
          echo "===== 搜索 .app ====="
          find . -name "*.app" -type d || true
          echo "===== 搜索 .ipa ====="
          find . -name "*.ipa" -type f || true

          # 把找到的归档复制到安全位置,防止被清理
          mkdir -p /tmp/safe_archive
          find . -name "*.xcarchive" -type d -exec cp -R {} /tmp/safe_archive/ \; || true
          find . -name "*.app" -type d -exec cp -R {} /tmp/safe_archive/ \; || true

          echo "===== 安全目录内容 ====="
          ls -la /tmp/safe_archive/ || echo "安全目录为空"

      - name: Upload xcarchive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heaps-ide-archive
          path: /tmp/safe_archive/
          if-no-files-found: warn
